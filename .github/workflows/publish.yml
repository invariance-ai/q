name: publish

# Publish @invariance/q to npm when a v* tag is pushed.
# Cut a release with: `npm version <patch|minor|major>` then
# `git push --follow-tags`. This workflow does the npm publish.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Gate the publish on a green build before anything hits the registry.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The pushed tag (vX.Y.Z) must match package.json version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME ($TAG) != package version $PKG" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
